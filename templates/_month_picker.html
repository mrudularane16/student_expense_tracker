{% set base = picker_extra or {} %}
<div class="month-picker">
  {% if period.prev %}
    <a class="icon-btn" aria-label="Previous month" href="{{ url_for(endpoint, **dict(base, month=period.prev)) }}">‹</a>
  {% else %}
    <span class="icon-btn disabled" aria-hidden="true">‹</span>
  {% endif %}

  <form method="GET" action="{{ url_for(endpoint) }}">
    {% for k, v in base.items() %}
      <input type="hidden" name="{{ k }}" value="{{ v }}">
    {% endfor %}
    <select class="in month-select" name="month" aria-label="Select month" onchange="this.form.submit()">
      <option value="all" {% if period.key == 'all' %}selected{% endif %}>All time</option>
      {% for m in months %}
        <option value="{{ m.key }}" {% if m.key == period.key %}selected{% endif %}>{{ m.label }}</option>
      {% endfor %}
    </select>
    <noscript><button class="btn" type="submit">Go</button></noscript>
  </form>

  {% if period.next %}
    <a class="icon-btn" aria-label="Next month" href="{{ url_for(endpoint, **dict(base, month=period.next)) }}">›</a>
  {% else %}
    <span class="icon-btn disabled" aria-hidden="true">›</span>
  {% endif %}
</div>
